<section class="wrapper-checkbox">
  <section class="checkbox">
    <span class="check-wrap">
      <input
        type="checkbox"
        id="space"
        [checked]="localExcludeSpaces"
        (change)="onExcludeSpacesToggle()"
        aria-label="Exclude spaces from character count"
      />
      <label for="space">Exclude Spaces</label>
    </span>
    <span class="check-wrap">
      <input
        type="checkbox"
        id="limit"
        [checked]="localIsLimitEnabled"
        (change)="onLimitToggle()"
        aria-label="Enable character limit"
      />
      <label for="limit">Set Character Limit</label>
      <input
        type="text"
        id="set-limit"
        [class.hide-limit]="!localIsLimitEnabled"
        [class.show-limit]="localIsLimitEnabled"
        [value]="localCharacterLimit"
        (input)="onLimitInput($event)"
        (keypress)="onKeyPress($event)"
        [attr.aria-hidden]="!localIsLimitEnabled"
        min="1"
        aria-label="Character limit value"
      />
    </span>
  </section>
  <p>{{ displayReadingTime }}</p>
</section>
